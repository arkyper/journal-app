spring.application.name=demo
server.port=${PORT:8080}
spring.devtools.restart.enabled=true
spring.devtools.livereload.enabled=true

# spring.profiles.active=dev

# spring.data.mongodb.host=localhost
# spring.data.mongodb.port=27017
# # spring.data.mongodb.username=demo
# # spring.data.mongodb.password=demo

spring.data.mongodb.uri=${MONGODB_URI}
spring.data.mongodb.port=27017
spring.data.mongodb.database=journaldb

# #Saying MongoDB to auto Index the Users
# spring.data.mongodb.auto-index-creation=true

# logging.level.com.arkyper.journalApp=DEBUG

# Turning OFF Loggers of a specific Class
# logging.level.com.arkyper.journalApp.service.UserService=OFF

# SETTING LOG at ROOT Level
# logging.level.root=ERROR

# Turning OFF Logs at ROOT Level
# logging.level.root=OFF

weather.api.key=${WEATHER_API_KEY}

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${JAVA_EMAIL}
spring.mail.password=${JAVA_EMAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
# spring.mail.properties.mail.smtp.starttls.required=true

# spring.redis.host=localhost
# spring.redis.port=6379
spring.redis.uri=${REDIS_URI}

# springdoc.swagger-ui.path=/docs

spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
